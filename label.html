<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>finderskeep.online - Label 10x5cm</title>
  <style>
    @page {
      size: 100mm 50mm;
      margin: 0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100mm;
      height: 50mm;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4.5mm 6mm;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .header {
      font-size: 13.5pt;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-align: center;
      border-bottom: 2px solid #000000;
      padding-bottom: 1.5mm;
    }
    .body-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.5mm 0;
    }
    .qr-container {
      width: 25mm;
      height: 25mm;
      border: 1.5px solid #000000;
      padding: 1mm;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }
    .qr-container img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .info-side {
      width: 58mm;
      display: flex;
      flex-direction: column;
      gap: 2mm;
    }
    .catchphrase {
      font-size: 10.5pt;
      font-weight: 700;
      line-height: 1.2;
    }
    .subtext {
      font-size: 7.5pt;
      font-weight: 500;
      color: #333333;
    }
    .footer {
      border-top: 2px solid #000000;
      padding-top: 1.5mm;
      text-align: center;
      font-size: 11pt;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="header">YOUR NEW PLANT BESTIE!</div>

  <div class="body-content">
    <div class="qr-container">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=http://finderskeep.online/&color=000000&bgcolor=ffffff" alt="QR Code">
    </div>
    <div class="info-side">
      <div class="catchphrase">Scan for care tips, watering guides & more!</div>
      <div class="subtext">Help your plant thrive effortlessly.</div>
    </div>
  </div>

  <div class="footer">http://finderskeep.online/</div>

</body>
</html>
